# L2jMobius part of the stack, merged over docker-compose.yml (paths are relative to the repository root).
# The build context is one chronicle directory of the sources/l2j_mobius submodule.
x-build: &build
  image: l2jmobius:${CHRONICLE:?set CHRONICLE in .env}
  build:
    context: ./sources/l2j_mobius/${CHRONICLE}
    dockerfile: ../../../servers/l2jmobius/Dockerfile
    additional_contexts:
      scripts: ./servers/l2jmobius

services:
  db:
    volumes:
      - ./servers/l2jmobius/initdb.sh:/docker-entrypoint-initdb.d/initdb.sh:ro
      - ./sources/l2j_mobius/${CHRONICLE}/dist/db_installer/sql/login:/l2-sql/login:ro
      - ./sources/l2j_mobius/${CHRONICLE}/dist/db_installer/sql/game:/l2-sql/game:ro

  login:
    <<: *build
    volumes:
      - ./data/logs/l2jmobius/login:/opt/l2/dist/login/log

  game:
    <<: *build
    volumes:
      - ./data/logs/l2jmobius/game:/opt/l2/dist/game/log

# Names predate the multi-server layout and are kept so existing characters stay where they are
volumes:
  db-data:
    name: l2jmobius-db-${CHRONICLE}
  game-state:
    name: l2jmobius-state-${CHRONICLE}
