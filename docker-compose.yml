# Server-independent part. The server-specific part (image, build, database name, SQL import, log paths)
# is servers/<SERVER>/compose.yml, merged on top through COMPOSE_FILE in .env. The project name, and with
# it the container, network and volume names, is COMPOSE_PROJECT_NAME in .env: one project per server and
# chronicle, e.g. l2server-acis-interlude. Both are kept in sync by l2server.sh (.env is created from .env.example).
x-db-env: &db-env
  MARIADB_USER: ${MARIADB_USER:?set MARIADB_USER in .env}
  MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}

# Marks the containers as this CLI's, so l2server.sh finds its projects whatever they are named
x-labels: &labels
  l2server: "true"

x-server: &server
  restart: unless-stopped
  labels: *labels
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    labels: *labels
    environment:
      <<: *db-env
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
    volumes:
      - db-data:/var/lib/mysql

  login:
    <<: *server
    command: login
    environment:
      <<: *db-env
      JAVA_OPTS: ${LOGIN_JAVA_OPTS:-}
    ports:
      - "${LOGIN_PORT:-2106}:2106"
    volumes:
      - ./overrides/${SERVER:?set SERVER in .env}:/overrides:ro

  game:
    <<: *server
    command: game
    depends_on:
      db:
        condition: service_healthy
      login:
        condition: service_started
    environment:
      <<: *db-env
      JAVA_OPTS: ${GAME_JAVA_OPTS:-}
      EXTERNAL_HOST: ${EXTERNAL_HOST:-127.0.0.1}
    ports:
      # Must stay 7777 on the host unless the game server port is changed as well
      - "7777:7777"
    volumes:
      - ./overrides/${SERVER}:/overrides:ro
      - game-state:/state
      # Geodata region files, not part of the server repositories; empty means no geodata (see README).
      # Writable: aCis saves geo_bugs.txt there
      - ./geodata/${SERVER}:/opt/l2/dist/game/data/geodata

  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["tools"]
    restart: unless-stopped
    labels: *labels
    environment:
      PMA_HOST: db
    ports:
      # Only on this machine: it gives access to the whole database
      - "127.0.0.1:${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy

# Named after the project (<project>_db-data), so every server and chronicle keeps its own data
volumes:
  db-data:
  game-state:
