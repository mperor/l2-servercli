name: l2jmobius

# Values come from .env (created from .env.example by l2.sh)
x-db-env: &db-env
  MARIADB_DATABASE: ${MARIADB_DATABASE:?set MARIADB_DATABASE in .env}
  MARIADB_USER: ${MARIADB_USER:?set MARIADB_USER in .env}
  MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}

x-server: &server
  image: l2jmobius:${CHRONICLE:?set CHRONICLE in .env}
  build:
    context: ./l2j_mobius/${CHRONICLE}
    dockerfile: ../../docker/Dockerfile
    additional_contexts:
      scripts: ./docker
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      <<: *db-env
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/initdb.sh:/docker-entrypoint-initdb.d/initdb.sh:ro
      - ./l2j_mobius/${CHRONICLE}/dist/db_installer/sql/login:/l2-sql/login:ro
      - ./l2j_mobius/${CHRONICLE}/dist/db_installer/sql/game:/l2-sql/game:ro

  login:
    <<: *server
    command: login
    environment:
      <<: *db-env
      JAVA_OPTS: ${LOGIN_JAVA_OPTS:-}
    ports:
      - "${LOGIN_PORT:-2106}:2106"
    volumes:
      - ./overrides:/overrides:ro
      - ./data/logs/login:/opt/l2/dist/login/log

  game:
    <<: *server
    command: game
    depends_on:
      db:
        condition: service_healthy
      login:
        condition: service_started
    environment:
      <<: *db-env
      JAVA_OPTS: ${GAME_JAVA_OPTS:-}
      EXTERNAL_HOST: ${EXTERNAL_HOST:-127.0.0.1}
    ports:
      # Must stay 7777 on the host unless GameserverPort is changed as well
      - "7777:7777"
    volumes:
      - ./overrides:/overrides:ro
      - ./data/logs/game:/opt/l2/dist/game/log
      - game-state:/state

  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PMA_HOST: db
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy

# One database and state volume per chronicle, so switching chronicles keeps data apart
volumes:
  db-data:
    name: l2jmobius-db-${CHRONICLE}
  game-state:
    name: l2jmobius-state-${CHRONICLE}
